name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: "--bundles deb,rpm"
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        if: matrix.platform != 'windows-latest'
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Install frontend dependencies
        run: npm install

      - name: Build bundled CPU MACE runtime
        env:
          # macos-latest is arm64. The x86_64 DMG must not bundle that interpreter.
          QDSPACE_MAC_ARCH: ${{ contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64' || 'aarch64' }}
        run: node scripts/build-mace-runtime.mjs

      - name: Build bundled Builder runtime
        env:
          QDSPACE_MAC_ARCH: ${{ contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64' || 'aarch64' }}
        run: node scripts/build-builder-runtime.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy is an AppImage. GitHub's Ubuntu runner has no usable FUSE, so libfuse2 alone still fails to start it.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # linuxdeploy's bundled strip dies on modern libraries and reports only "failed to run linuxdeploy".
          NO_STRIP: "true"
        with:
          tagName: v__VERSION__
          releaseName: QDSpace Desktop v__VERSION__
          releaseBody: |
            Installers for Windows, Linux, and macOS.
            The CPU MACE sidecar is included (Python 3.11 and a CPU PyTorch build of MACE, started on 127.0.0.1:8765).
            The structure Builder is included and starts on 127.0.0.1:8000 (no Docker needed).
            The structure library is still not included.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
